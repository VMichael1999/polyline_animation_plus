name: polyline_animation_plus
description: "A Flutter package for creating smooth, customizable polyline animations on Google Maps, ideal for transport, delivery, and route-visualization applications."
version: 1.1.0
homepage: https://github.com/VMichael1999/polyline_animation_plus
repository: https://github.com/VMichael1999/polyline_animation_plus
issue_tracker: https://github.com/VMichael1999/polyline_animation_plus/issues
documentation: https://github.com/VMichael1999/polyline_animation_plus
environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  google_maps_flutter_platform_interface: ^2.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  plugin_platform_interface: ^2.1.7

flutter:
  uses-material-design: true

platforms:
  android:
  ios:
  web:

topics:
  - map-animation
  - animated-polylines
